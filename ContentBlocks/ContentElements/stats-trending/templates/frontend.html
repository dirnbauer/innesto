<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="innesto-stats-trending" href="{cb:assetPath()}/frontend.css"/>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" spacing="md" class="innesto-stats-trending-section">
    <d:layout.container>
        <d:molecule.sectionIntro align="center">
            <f:fragment name="eyebrow"><f:if condition="{data.eyebrow}">{data -> f:render.text(field: 'eyebrow')}</f:if></f:fragment>
            <f:fragment name="heading"><f:if condition="{data.header}">{data -> f:render.text(field: 'header')}</f:if></f:fragment>
        </d:molecule.sectionIntro>

        <f:if condition="{data.stats_trending_items}">
            <dl class="innesto-stats-trending">
                <f:for each="{data.stats_trending_items}" as="entry" iteration="iterator">
                    <div class="innesto-stats-trending__stat">
                        <dt class="innesto-stats-trending__name">{entry.title}</dt>
                        <f:if condition="{entry.delta}">
                            <dd class="innesto-stats-trending__delta {f:if(condition: '{entry.trend} == \'down\'', then: 'innesto-stats-trending__delta--down', else: 'innesto-stats-trending__delta--up')}">
                                <f:if condition="{entry.trend} == 'down'">
                                    <f:then>
                                        <d:atom.icon name="trending-down" size="xs" class="innesto-stats-trending__delta-icon"/>
                                    </f:then>
                                    <f:else>
                                        <d:atom.icon name="trending-up" size="xs" class="innesto-stats-trending__delta-icon"/>
                                    </f:else>
                                </f:if>
                                <span class="sr-only"><f:if condition="{entry.trend} == 'down'"><f:then><f:translate key="LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:trend.down"/></f:then><f:else><f:translate key="LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:trend.positive"/></f:else></f:if> </span>
                                <span>{entry.delta}</span>
                            </dd>
                        </f:if>
                        <dd class="innesto-stats-trending__value">{entry.value}</dd>
                    </div>
                </f:for>
            </dl>
        </f:if>
    </d:layout.container>
</d:layout.section>

</html>
