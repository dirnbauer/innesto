<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="innesto-stats-status" href="{cb:assetPath()}/frontend.css"/>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" spacing="md" class="innesto-stats-status-section">
    <d:layout.container>
        <d:molecule.sectionIntro align="center">
            <f:fragment name="eyebrow"><f:if condition="{data.eyebrow}">{data -> f:render.text(field: 'eyebrow')}</f:if></f:fragment>
            <f:fragment name="heading"><f:if condition="{data.header}">{data -> f:render.text(field: 'header')}</f:if></f:fragment>
        </d:molecule.sectionIntro>

        <f:if condition="{data.stats_status_items}">
            <dl class="innesto-stats-status">
                <f:for each="{data.stats_status_items}" as="entry" iteration="iterator">
                    <div class="innesto-stats-status__card innesto-stats-status__card--{entry.status}">
                        <dt class="innesto-stats-status__name">{entry.title}</dt>
                        <dd class="innesto-stats-status__value">{entry.value}</dd>
                        <dd class="innesto-stats-status__panel">
                            <span class="innesto-stats-status__icon" aria-hidden="true">
                                <f:switch expression="{entry.status}">
                                    <f:case value="observe">
                                        <d:atom.icon name="info" size="sm"/>
                                    </f:case>
                                    <f:case value="critical">
                                        <d:atom.icon name="alert-triangle" size="sm"/>
                                    </f:case>
                                    <f:defaultCase>
                                        <d:atom.icon name="check" size="sm"/>
                                    </f:defaultCase>
                                </f:switch>
                            </span>
                            <span class="innesto-stats-status__meta">
                                <f:if condition="{entry.detail}">
                                    <span class="innesto-stats-status__detail">
                                        <f:if condition="{entry.link}">
                                            <f:then>
                                                <f:link.typolink parameter="{entry.link}" class="innesto-stats-status__link">{entry.detail}</f:link.typolink>
                                            </f:then>
                                            <f:else>{entry.detail}</f:else>
                                        </f:if>
                                    </span>
                                </f:if>
                                <span class="innesto-stats-status__state">
                                    <span class="innesto-stats-status__dot" aria-hidden="true"></span>
                                    <f:switch expression="{entry.status}">
                                        <f:case value="observe"><f:translate key="LLL:EXT:innesto/Resources/Private/Language/labels.xlf:status.observe"/></f:case>
                                        <f:case value="critical"><f:translate key="LLL:EXT:innesto/Resources/Private/Language/labels.xlf:status.critical"/></f:case>
                                        <f:defaultCase><f:translate key="LLL:EXT:innesto/Resources/Private/Language/labels.xlf:status.withinTarget"/></f:defaultCase>
                                    </f:switch>
                                </span>
                            </span>
                            <d:atom.icon name="chevron-right" size="sm" class="innesto-stats-status__chevron"/>
                        </dd>
                    </div>
                </f:for>
            </dl>
        </f:if>
    </d:layout.container>
</d:layout.section>

</html>
