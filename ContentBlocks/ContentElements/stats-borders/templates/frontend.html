<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="innesto-stats-borders" href="{cb:assetPath()}/frontend.css"/>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" spacing="md" class="innesto-stats-borders-section">
    <d:layout.container>
        <d:molecule.sectionIntro align="center">
            <f:fragment name="eyebrow"><f:if condition="{data.eyebrow}">{data -> f:render.text(field: 'eyebrow')}</f:if></f:fragment>
            <f:fragment name="heading"><f:if condition="{data.header}">{data -> f:render.text(field: 'header')}</f:if></f:fragment>
        </d:molecule.sectionIntro>

        <f:if condition="{data.stats_borders_items}">
            <dl class="innesto-stats-borders">
                <f:for each="{data.stats_borders_items}" as="entry" iteration="iterator">
                    <div class="innesto-stats-borders__cell">
                        <dt class="innesto-stats-borders__metric">{entry.title}</dt>
                        <dd class="innesto-stats-borders__row">
                            <span class="innesto-stats-borders__value">
                                {entry.value}
                                <f:if condition="{entry.previous}">
                                    <span class="innesto-stats-borders__previous">{entry.previous}</span>
                                </f:if>
                            </span>
                            <f:if condition="{entry.difference}">
                                <span class="innesto-stats-borders__badge {f:if(condition: '{entry.trend} == \'down\'', then: 'innesto-stats-borders__badge--down', else: 'innesto-stats-borders__badge--up')}">
                                    <f:if condition="{entry.trend} == 'down'">
                                        <f:then>
                                            <d:atom.icon name="trending-down" size="xs" class="innesto-stats-borders__trend-icon"/>
                                        </f:then>
                                        <f:else>
                                            <d:atom.icon name="trending-up" size="xs" class="innesto-stats-borders__trend-icon"/>
                                        </f:else>
                                    </f:if>
                                    <span class="sr-only"><f:if condition="{entry.trend} == 'down'"><f:then><f:translate key="LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:trend.down"/></f:then><f:else><f:translate key="LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:trend.positive"/></f:else></f:if> </span>
                                    <span>{entry.difference}</span>
                                </span>
                            </f:if>
                        </dd>
                    </div>
                </f:for>
            </dl>
        </f:if>
    </d:layout.container>
</d:layout.section>

</html>
