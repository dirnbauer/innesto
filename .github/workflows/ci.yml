name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: TYPO3 14 / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, intl, gd, zip, pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install the current compatible TYPO3 runtime
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify dependencies
        run: |
          composer check-platform-reqs
          composer audit
          composer show typo3/cms-core

      - name: PHP lint
        run: find Classes Configuration scripts Tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Unit, functional, static and content checks
        run: Build/Scripts/runTests.sh -s ci
